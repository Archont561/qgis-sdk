coverage:
  precision: 2
  round: down
  range: "90...100"
  status:
    project:
      qgis-sdk-python:
        target: 90%
        threshold: 0%
        flags:
          - qgis-sdk-python
      qgis-sdk-typescript:
        target: 90%
        threshold: 0%
        flags:
          - qgis-sdk-typescript

flags:
  qgis-sdk-python:
    paths:
      - packages/qgis-sdk-python/src/
  qgis-sdk-typescript:
    paths:
      - packages/qgis-sdk-typescript/src/
