; Writing style for the documentation layer (docs/ and the root landing page).
; The rules are this repository's own: they live in docs/vale/styles/Qgis so a
; check runs without syncing a third-party style package over the network.
; `bun run lint-docs` runs this with the markdown and link checks.

StylesPath = docs/vale/styles

MinAlertLevel = warning

[*.md]
BasedOnStyles = Qgis
