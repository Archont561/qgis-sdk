[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "qgis-sdk-release"
version = "0.1.0"
description = "Release planning and publishing CLI for the QGIS SDK workspace."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "QGIS SDK contributors" }]

[tool.hatch.build.targets.wheel]
packages = ["src/qgis_sdk_release"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
