[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "qgis-sdk"
version = "0.3.0"
description = "Python SDK foundations for QGIS plugin development."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "QGIS SDK contributors" }]
dependencies = ["typer==0.27.3"]

[project.scripts]
qgis-sdk = "qgis_sdk.__main__:main"

[project.optional-dependencies]
controlled-deployment = ["pydantic==2.14.1"]
dev = [
	"hypothesis==6.169.4",
	"pydantic==2.14.1",
	"jsonschema==4.26.0",
	"mashumaro==3.23",
	"pytest==9.1.1",
	"pytest-cov==7.1.0",
	"pytest-bdd==9.0.0",
	# skill-creator's quick_validate reads YAML frontmatter; pixi only gets PyYAML
	# transitively, so a pip-only test environment needs it declared.
	"pyyaml==6.0.3",
	"rich==15.0.0",
	"typer==0.27.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/qgis_sdk"]

[tool.hatch.build.targets.sdist]
# `scripts/` is development automation - qualification harnesses and generators -
# so it is not part of the distribution: the wheel cannot carry it (it only packs
# src/qgis_sdk) and neither should the source archive. Tests stay in the sdist so a
# source install can still be verified.
exclude = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# The layer markers are registered by tests/conftest.py from tests/layers.py;
# a misspelt layer is an error, not a test that silently runs everywhere.
addopts = ["--strict-markers"]
