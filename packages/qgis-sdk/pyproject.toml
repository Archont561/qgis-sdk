[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "qgis-sdk"
version = "0.1.0"
description = "Python SDK foundations for QGIS plugin development."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "QGIS SDK contributors" }]

[project.optional-dependencies]
dev = [
	"hypothesis==6.169.4",
	"pytest==9.1.1",
	"pytest-cov==7.1.0",
	"rich==15.0.0",
	"typer==0.27.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/qgis_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
