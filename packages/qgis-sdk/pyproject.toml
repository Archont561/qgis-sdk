[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "qgis-sdk"
version = "0.1.0"
description = "Python SDK foundations for QGIS plugin development."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "QGIS SDK contributors" }]
dependencies = ["typer==0.27.3"]

[project.scripts]
qgis-sdk = "qgis_sdk.cli:main"

[project.optional-dependencies]
controlled-deployment = ["pydantic==2.14.1"]
dev = [
	"hypothesis==6.169.4",
	"pydantic==2.14.1",
	"jsonschema==4.26.0",
	"mashumaro==3.23",
	"pytest==9.1.1",
	"pytest-cov==7.1.0",
	"pytest-bdd==9.0.0",
	# skill-creator's quick_validate reads YAML frontmatter; pixi only gets PyYAML
	# transitively, so a pip-only test environment needs it declared.
	"pyyaml==6.0.3",
	"rich==15.0.0",
	"typer==0.27.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/qgis_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
