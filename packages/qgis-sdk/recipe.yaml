schema_version: 1

context:
  version: "0.1.1"

package:
  name: qgis-sdk
  version: ${{ version }}

source:
  path: .

build:
  number: 0
  noarch: python
  script:
    - python -m pip install . --no-deps --no-build-isolation -vv
  python:
    entry_points:
      - qgis-sdk = qgis_sdk.__main__:main

requirements:
  host:
    - hatchling ==1.32.4
    - pip
    - python >=3.11,<4
  run:
    - python >=3.11,<4
    # The shipped `qgis-sdk` console command is Typer-based, so the Conda package
    # carries the same runtime requirement the wheel declares.
    - typer ==0.27.3

tests:
  - python:
      imports:
        - qgis_sdk
      pip_check: true
  - script:
      - qgis-sdk --help

about:
  summary: Python SDK foundations for QGIS plugin development
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/Archont561/qgis-sdk
  repository: https://github.com/Archont561/qgis-sdk
