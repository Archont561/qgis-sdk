[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "qgis-sdk-runtime"
version = "0.7.0"
description = "The Python runtime for building QGIS plugins with less boilerplate."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "QGIS SDK contributors" }]
# Stdlib only (decision-35): QGIS and Qt are host-provided and never declared,
# and `qgis-sdk build` vendors this tree into a plugin ZIP as-is. A dependency
# here would have to be vendored too.
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/qgis_sdk"]
