[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "qgis-sdk"
version = "0.7.0"
description = "The next-generation Python SDK for effortless QGIS plugin authoring."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "QGIS SDK contributors" }]
# A code-free meta distribution (decision-35): `pip install qgis-sdk` keeps
# meaning "the developer kit". The pins are exact and stamped together with the
# two distributions they name; `release.py verify-versions` refuses a kit whose
# pins disagree with the manifests next to it.
dependencies = ["qgis-sdk-runtime==0.7.0", "qgis-sdk-tools==0.7.0"]

[project.optional-dependencies]
# The workspace's own test suite (packages/qgis-sdk-python/tests), which covers
# both distributions; installed by the QGIS-free CI matrix and the arena fallback
# next to editable installs of the runtime and the tools.
dev = [
	"hypothesis==6.169.4",
	"jsonschema==4.26.0",
	"mashumaro==3.23",
	"pytest==9.1.1",
	"pytest-cov==7.1.0",
	"pytest-bdd==9.0.0",
	"rich==15.0.0",
	"typer==0.27.3",
]

[tool.hatch.build.targets.wheel]
# No code: the wheel is metadata only.
bypass-selection = true

[tool.hatch.build.targets.sdist]
# The tests and the developer scripts next to this manifest are workspace
# material, not part of the kit.
exclude = ["scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["../qgis-sdk-runtime/src", "../qgis-sdk-tools/src"]
# The layer markers are registered by tests/conftest.py from tests/layers.py;
# a misspelt layer is an error, not a test that silently runs everywhere.
addopts = ["--strict-markers"]
