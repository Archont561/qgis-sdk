; Python version compatibility.
;
; `requires-python = ">=3.11"` in the three distributions is a promise, and the
; Pixi environments test one interpreter - the newest. tox is the other half:
; the QGIS-free suite runs on every version the manifests claim, each in its own
; virtual environment, on the same source tree.
;
;   pixi run -e default tox -e py311      one version
;   pixi run -e default tox               every version installed here
;
; CI runs one environment per job (`.github/workflows/compat.yml`), because an
; interpreter it has to guess at is a version nobody tested.

[tox]
; Add a version here when a package widens `requires-python`, and remove one
; only when every manifest has dropped it.
envlist = py311, py312, py313, py314
; A missing interpreter fails the run instead of being skipped: a matrix that
; quietly drops a version proves nothing about that version.
skip_missing_interpreters = false

[testenv]
description = QGIS-free suite on {envname}
; The repository root is not a distribution. It carries a `pyproject.toml` for
; `[tool.rude]` alone, and tox would otherwise build an sdist of the whole
; checkout and fail setuptools' flat-layout discovery on `apps/`, `backlog/`,
; `packages/` and `automation/`. Nothing here needs packaging: the three
; distributions are installed from their source trees by `deps` below.
package = skip
; The workspace is not one distribution: `qgis-sdk` is a metadata-only kit that
; pins the runtime and the tools at its own version, so both are installed from
; their source trees and the kit next to them. The `dev` extra is the same set
; of test dependencies the CI matrix installs.
deps =
    -e {toxinidir}/packages/qgis-sdk-runtime
    -e {toxinidir}/packages/qgis-sdk-tools
    -e {toxinidir}/packages/qgis-sdk-python[dev]
; `tests/conftest.py` registers the layer markers and the pytest configuration
; lives in the package it belongs to, so the run happens there.
changedir = {toxinidir}/packages/qgis-sdk-python
commands =
    python -m pytest {posargs}
