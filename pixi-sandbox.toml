schema = 1
branch_prefix = "sandbox"
cargo_vendor = false

[[bundle]]
name = "developer"
environments = ["default", "build", "bun"]
platforms = ["linux-64"]

# Publish only when a path that can change the packed transport is touched.
# Docs-only, backlog-only, and README pushes are ignored — no pack, no push,
# no runner minutes. Derived from pixi-sandbox task-53 ([workflow] table).
[workflow]
push_paths = [
  "bun.lock",
  "package.json",
  "pixi-sandbox.toml",
  "pixi.lock",
  "pixi.toml",
]
relock_paths = [
  "bun.lock",
  "package.json",
  "pixi-sandbox.toml",
  "pixi.lock",
  "pixi.toml",
]
