name: Debug gate

# TEMPORARY. Reproduces the pre-release quality gate's `test_python` command -
# the one the `autorelease` train runs against `main` and no pull request runs -
# and publishes its output as this job's check-run summary, because job logs are
# not reachable from the environment that has to read them.
#
# Deleted in the change that fixes the gate.
on:
  # `push`, not `workflow_dispatch`: a dispatch needs the file on the default
  # branch, and the branch this has to run on is the one carrying the fix.
  push:
    branches: ["arena/9a0c1aab-qgis-sdk"]

permissions:
  contents: read
  checks: write

jobs:
  test-python:
    name: test_python (as autorelease runs it)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.81.0
          environments: default
          cache: true
          locked: true

      - name: Generate the Processing provider modules
        run: pixi run -e default python packages/qgis-sdk-python/scripts/generate_processing_providers.py

      - name: Run test_python
        id: gate
        continue-on-error: true
        run: |
          set -o pipefail
          pixi run -e default automation -- test_python 2>&1 | tee gate.log
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Publish the output as a check-run summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_ID: ${{ job.check_run_id }}
        run: |
          set -euo pipefail
          summary="$(tail -c 60000 gate.log)"
          jq -n --arg title "test_python exit ${{ steps.gate.outputs.status }}" \
                --arg summary "$summary" \
                '{output: {title: $title, summary: $summary}}' > payload.json
          gh api "repos/$GITHUB_REPOSITORY/check-runs/$JOB_ID" -X PATCH --input payload.json

      - name: Fail when the gate failed
        if: steps.gate.outputs.status != '0'
        run: exit 1
