name: CI

on:
  # Branch protection on `main` requires these checks on the pull request head
  # and requires the branch to be up to date, so the tree that lands is the tree
  # that was tested. A post-merge `push` run would bill the whole matrix a second
  # time for that same tree, so there is deliberately no `push` trigger here.
  # The deploy and release workflows keep their own `push` triggers.
  #
  # `pull_request` has no path filter on purpose: a required check from a
  # workflow skipped by path filtering stays Pending and blocks the merge.
  # `backlog.yml` still runs its fast guard on backlog-only pull requests.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Supersede stale runs: each new head on a pull request replaces the previous
# one, so cancel the in-flight run for the old SHA instead of paying for two
# full matrices. A `workflow_dispatch` on the default branch queues behind the
# previous run rather than discarding its result. (TASK-34)
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  # The cheap gates, in their own job and first in the file. They finish in about
  # a minute, so a formatting slip or a 31-line function fails the pull request
  # before the native suite has installed QGIS, and `abort` is told to cancel the
  # rest of the run from there. The heavy jobs keep their own expensive steps.
  #
  # The Clean Code rules live here because there is no budget to absorb a finding
  # (decision-82): the gate fails on anything Rude reports, and the same gate is
  # the `pre-commit` hook, so a contributor meets it before the push does.
  fast:
    name: Fast gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        id: s01
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit range is the merge base of the pull request, which needs
          # the history the default depth-1 checkout does not have.
          fetch-depth: 0

      - name: Set up Pixi
        id: s02
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          environments: default
          cache: true
          locked: true

      - name: Compute commit range
        id: s03
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python -m automation.commits

      - name: Check commit messages
        id: s04
        run: pixi run -e default automation -- check_commits

      # `automation check` is the fast local gate: Ruff lint and format, the Clean
      # Code rules, Alint and actionlint, in the order `dodo.py` declares. One
      # command, so what CI runs and what a contributor runs are the same list.
      - name: Run the fast gates
        id: s05
        run: pixi run -e default automation -- check

      # The policy's own tests travel with the policy: a rule that stops matching
      # anything is a test, not a lint result.
      - name: Test repository policy
        id: s06
        run: pixi run -e default automation -- test_alint_policy

      - name: Report the failed step
        id: s18
        if: failure()
        env:
          STEPS: ${{ toJSON(steps) }}
        run: pixi run -e default automation -- report_steps

  linux:
    name: Linux checks
    runs-on: ubuntu-latest
    # Bound the job: the Actions default is 360 minutes, and a run hung on a step that
    # never finishes is not a result anybody is waiting for.
    timeout-minutes: 20
    steps:
      - name: Checkout
        id: s01
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Pixi
        id: s02
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          environments: >-
            default
            bun
          cache: true
          locked: true

      - name: Install JavaScript dependencies
        id: s03
        run: pixi run -e default automation -- install_js

      # Every `*.feature` file is linted, and a feature file outside the
      # directories the check knows is a failure rather than a file that
      # quietly stops being linted. The task keeps gherlint's pydantic 1 in a
      # venv of its own, so the default environment's pydantic 2 is untouched.
      - name: Lint Gherkin feature files
        id: s27
        run: pixi run -e default automation -- lint_features

      - name: Test release tooling
        id: s09
        run: pixi run -e default automation -- test_scripts

      - name: Verify the scoped versions and the shared contract
        id: s10
        run: pixi run -e default automation -- release_verify_versions

      # The Processing provider modules are generated from catalogue.json
      # (pure Python, no QGIS needed) and never committed; the bridge
      # generator and the suites import them, so they are generated here first.
      - name: Generate the Processing provider modules
        id: s31
        run: pixi run -e default python packages/qgis-sdk-python/scripts/generate_processing_providers.py

      # Regenerate bridge artifacts and reject orphaned sample/host outputs with
      # their generator/source headers in the two owned directories (TASK-142).
      # The Git status sweep catches other TypeScript tree changes; the reference
      # page's generated schema is checked separately. No orphan is deleted.
      - name: Check the generated bridge clients are current
        id: s19
        run: pixi run -e default automation -- check_generated

      # The Processing snapshot the runtime ships (qgis_sdk/processing) is
      # generated from the pinned QGIS by the same reader and emitters
      # `qgis-sdk processing generate` uses; it is read here because this is
      # the one job with a QGIS to read (decision-64).
      - name: Check the Processing snapshot is current
        id: s22
        env:
          QT_QPA_PLATFORM: offscreen
        run: pixi run -e default python packages/qgis-sdk-python/scripts/generate_processing_snapshot.py --check

      # The default environment carries the QGIS feature, so this is the only
      # place the native layers actually execute against real Qt and QGIS: the
      # native form path, the QGIS network transport, the restricted WebEngine
      # page and its WebChannel binding, the thread-pool job workers and the
      # native service backends. A developer machine needs a display setup and
      # this sandbox has no Qt at all. `-m native` is the umbrella marker that
      # tests/conftest.py derives from the `qt`, `qgis`, `webengine` and
      # `desktop` layers (TASK-7); the network and browser files talk to
      # loopback servers only (TASK-5 AC 3, TASK-20 AC 3); the browser file
      # sets the Chromium flags the TASK-23 headless harness qualified; the
      # jobs file proves GUI-thread delivery over a real QThreadPool (TASK-15).
      - name: Test the native layers offscreen
        id: s11
        env:
          QT_QPA_PLATFORM: offscreen
          QGIS_SDK_NATIVE_SERVICES: "1"
        run: pixi run -e default automation -- native

      # The reference plugin is a plugin project, not part of the SDK suite: it
      # runs through its own `qgis-sdk test`, the pure target on the SDK fakes
      # and the `qgis` target on the headless QGIS above (TASK-22 AC 2). The
      # page, `build` and `dev` halves stay in the opt-in harness (doc-14).
      - name: Test the reference plugin through qgis-sdk test
        id: s20
        run: pixi run -e default automation -- reference_example

      # The page is a member of the Bun workspace and depends on the bridge
      # through `workspace:*`, so its Vitest suite runs against the checkout's
      # `packages/qgis-sdk-typescript`, built first by turbo (decision-41).
      - name: Test the reference page on the workspace bridge
        id: s21
        run: pixi run -e default automation -- test_reference_web

      - name: Lint and format TypeScript
        id: s12
        run: pixi run -e default automation -- biome

      # AGENTS.md is two documents in one: three regions are generated from the
      # repository (`agents-md` plus `scripts/agents/refresh.mjs`), and a stale
      # one sends an agent to a directory that no longer exists or a branch that
      # was renamed. The refresh is deterministic, so a difference is the whole
      # check.
      - name: Check AGENTS.md is current
        id: s28
        run: pixi run -e default automation -- agents_check

      - name: Typecheck TypeScript
        id: s14
        run: pixi run -e default automation -- typecheck

      # The static Storybook is the portable-story catalogue of qgis-sdk-ui
      # (TASK-70); it is built here so a story that no longer compiles fails
      # the gate; `docs.yml` publishes it under the documentation site
      # (`/qgis-sdk/storybook/`, TASK-43).
      - name: Build the qgis-sdk-ui Storybook
        id: s23
        run: pixi run -e default automation -- storybook

      # A red job whose report is only "exit code 1" costs a rerun to diagnose,
      # and the log archive is not reachable from every client. Every step above
      # carries an id so this can name the one that actually failed.
      - name: Report the failed step
        id: s18
        if: failure()
        env:
          STEPS: ${{ toJSON(steps) }}
        run: pixi run -e default automation -- report_steps

  # Coverage is the longest Linux step. Run it in parallel with the other gates
  # on a separate runner: each job restores its own locked environments and
  # builds its own artifacts, avoiding shared dist/ and coverage directories.
  coverage:
    name: Linux coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        id: s01
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Pixi
        id: s02
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          environments: >-
            default
            bun
          cache: true
          locked: true

      - name: Install JavaScript dependencies
        id: s03
        run: pixi run -e default automation -- install_js

      # The Processing provider modules are generated from catalogue.json
      # (pure Python, no QGIS needed) and never committed; the coverage suite
      # imports them, so they are generated here first.
      - name: Generate the Processing provider modules
        id: s31
        run: pixi run -e default python packages/qgis-sdk-python/scripts/generate_processing_providers.py

      - name: Check coverage for all packages
        id: coverage
        # The coverage run drives the whole workspace from the Bun environment,
        # so it goes through the harness rather than a task: `run_logged` keeps
        # the output for the annotation step, and nesting it inside the Python
        # environment would change which `python` the packages' suites find.
        run: python -m automation.ci run-log coverage-output.log -- pixi run -e bun bun run coverage

      - name: Annotate the coverage failure
        id: s15
        if: failure() && steps.coverage.outcome == 'failure'
        run: python -m automation.ci annotate-coverage coverage-output.log

      # Codecov is a reporting destination, not a gate: the 90% coverage checks
      # above already ran. A deactivated Codecov repository or an upload outage
      # must not turn a green pull request red (see doc-14). Keep
      # `fail_ci_if_error: true` inside the action so the error is annotated,
      # but do not let it fail the required `Linux coverage` context. The
      # follow-up step turns the rejection into a warning and a job summary.
      - name: Upload Python coverage
        id: s16
        if: ${{ !cancelled() && steps.coverage.outcome == 'success' }}
        continue-on-error: true
        # v6+ is the first codecov major whose embedded github-script targets
        # node24; v5 makes fresh runs emit Node 20 deprecation warnings.
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: packages/qgis-sdk-python/coverage/lcov.info
          flags: qgis-sdk-python
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload TypeScript coverage
        id: s17
        if: ${{ !cancelled() && steps.coverage.outcome == 'success' }}
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/qgis-sdk-typescript/lcov.info
          flags: qgis-sdk-typescript
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload UI coverage
        id: s24
        if: ${{ !cancelled() && steps.coverage.outcome == 'success' }}
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/qgis-sdk-ui/lcov.info
          flags: qgis-sdk-ui
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Report unavailable Codecov uploads
        id: s29
        if: ${{ !cancelled() && steps.coverage.outcome == 'success' && (steps.s16.outcome == 'failure' || steps.s17.outcome == 'failure' || steps.s24.outcome == 'failure') }}
        run: |
          set -euo pipefail
          echo "::warning title=Codecov upload unavailable::The coverage checks passed, but Codecov did not accept one or more LCOV reports; the pull request is not at fault"
          {
            echo "### Codecov uploads unavailable"
            echo "The Python, TypeScript and UI 90% coverage checks passed. Codecov did not accept one or more LCOV reports, so the external dashboard may be stale; the CI gate is unaffected."
          } >> "$GITHUB_STEP_SUMMARY"

      # A red job whose report is only "exit code 1" costs a rerun to diagnose,
      # and the log archive is not reachable from every client. Every step above
      # carries an id so this can name the one that actually failed.
      - name: Report the failed step
        id: s18
        if: failure()
        env:
          STEPS: ${{ toJSON(steps) }}
        run: pixi run -e default automation -- report_steps

  # The QGIS 3.44 LTS row: the version Debian and Ubuntu install, with QGIS
  # Server in the same build. Two things no other job can make:
  #
  # * conda-forge passes -D WITH_SERVER=FALSE on every platform, so
  #   `qgis.server` does not exist in the Pixi environment the other jobs use
  #   and the server host is proven there against the scripted interface
  #   (decision-52 implementation note). This row installs the Debian packages
  #   that do carry the bindings.
  # * the LTS is a Qt 5 / PyQt5 build while the locked environment is Qt 6, so
  #   this is the one place the binding-agnostic adapters
  #   (qgis_sdk.adapters._qt) are proven on Qt 5 (decision-70).
  #
  # A row that collected nothing is a failure, not a pass: automation/ci lts
  # probes the modules before pytest starts.
  lts:
    name: QGIS 3.44 LTS
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        id: s01
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # qgis.org builds WITH_SERVER=ON and WITH_BINDINGS=ON for the LTS
      # repository, and that repository is where the 3.44 packages live until
      # 4.x reaches it. The mirror is a third party: an outage is not a defect
      # in the change under test, so provisioning gets bounded, retried
      # commands and reports `ready=false` with a warning rather than failing.
      # The two steps that need real QGIS then skip, keeping the required
      # context green while making the skipped qualification visible. A real
      # native test failure is still red.
      - name: Install the QGIS 3.44 LTS packages
        id: s02
        run: |
          set -uo pipefail
          provision() {
            sudo install -d -m 755 /etc/apt/keyrings || return 1
            timeout 60 sudo wget -qO /etc/apt/keyrings/qgis-archive-keyring.gpg \
              https://download.qgis.org/downloads/qgis-archive-keyring.gpg || return 1
            keyring=/etc/apt/keyrings/qgis-archive-keyring.gpg
            echo "deb [signed-by=$keyring] https://qgis.org/debian noble main" \
              | sudo tee /etc/apt/sources.list.d/qgis.list >/dev/null || return 1
            timeout 120 sudo apt-get -o Acquire::Retries=3 update || return 1
            timeout 180 sudo apt-get -o Acquire::Retries=3 install -y \
              --no-install-recommends qgis qgis-server python3-qgis || return 1
            python3 -c "import qgis.core, qgis.server; print(qgis.core.Qgis.version())" || return 1
          }
          ready=false
          for attempt in 1 2 3; do
            if provision; then
              ready=true
              break
            fi
            echo "::warning::QGIS 3.44 LTS provisioning attempt $attempt failed; retrying"
            sleep 15
          done
          if [ "$ready" != true ]; then
            echo "::warning title=QGIS 3.44 LTS unavailable::qgis.org did not answer; the native qualification was skipped, the change is not at fault"
            echo "### QGIS 3.44 LTS skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "The qgis.org apt mirror did not answer, so the server and Desktop native modules did not run. The rest of the CI matrix still gated this change." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"

      # The bindings belong to the system interpreter, so the environment is
      # built over it rather than around it: --system-site-packages is what makes
      # `import qgis.server` work in the interpreter that runs pytest.
      - name: Install the SDK over the system bindings
        id: s03
        if: ${{ steps.s02.outputs.ready == 'true' }}
        run: |
          set -euo pipefail
          python3 -m venv --system-site-packages .venv-lts
          .venv-lts/bin/python -m pip install --quiet --upgrade pip
          .venv-lts/bin/python -m pip install --quiet pytest pytest-bdd \
            -e packages/qgis-sdk-runtime -e packages/qgis-sdk-tools

      # The Processing provider modules are generated from catalogue.json
      # (pure Python, no QGIS needed) and never committed; the LTS suite
      # imports them, so they are generated here first.
      - name: Generate the Processing provider modules
        id: s05
        if: ${{ steps.s02.outputs.ready == 'true' }}
        run: .venv-lts/bin/python packages/qgis-sdk-python/scripts/generate_processing_providers.py

      # QGIS_SDK_SERVER_DEV opts the dev-loop harness in: it starts a real
      # QgsServer on loopback and proves that a saved filter edit is what the
      # next request runs (TASK-80 AC 4).
      - name: Test both hosts on the LTS
        id: s04
        if: ${{ steps.s02.outputs.ready == 'true' }}
        env:
          QT_QPA_PLATFORM: offscreen
          QGIS_SDK_SERVER_DEV: "1"
        run: .venv-lts/bin/python -m automation.ci lts

  # Preserve the existing required `checks` status while ensuring a failed,
  # cancelled, or unexpectedly skipped Linux job cannot pass the aggregate.
  checks:
    needs: [fast, linux, coverage, lts]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report the Linux job results
        run: >-
          echo "Fast gates: ${{ needs.fast.result }}; Linux checks: ${{ needs.linux.result }}; Linux coverage: ${{ needs.coverage.result }}; QGIS 3.44 LTS: ${{ needs.lts.result }}"

      - name: Require every Linux job to succeed
        if: ${{ needs.fast.result != 'success' || needs.linux.result != 'success' || needs.coverage.result != 'success' || needs.lts.result != 'success' }}
        run: exit 1

  # GitHub cancels matrix siblings only through `strategy.fail-fast`; there is no
  # setting that cancels unrelated jobs of one run. This job is the API route, and
  # it waits for `checks` on purpose so the aggregate verdict is already recorded
  # when the run stops: a red `checks` is what a reviewer and the release path read,
  # and cancelling before it reports would replace that verdict with "cancelled".
  # What it actually saves is `cross-platform`, which keeps running on macOS (10x)
  # and Windows (2x) after a Linux gate has already failed.
  abort:
    name: Abort the rest of the run
    needs: [checks]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Cancel the jobs that are still running
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }} || echo "::warning::could not cancel the run"

  # Portable Python/TypeScript suites on the other supported host platforms.
  # This is compatibility evidence only: it is not QGIS Desktop, WebEngine or
  # plugin-coexistence qualification (see TASK-33), and it does not repeat the
  # coverage gate or Codecov uploads owned by the Linux coverage job.
  cross-platform:
    name: cross-platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One host failing is enough: the other one is re-tested by the next push, and
      # a macOS minute bills 10x. This matrix is the only place `fail-fast` reaches -
      # unrelated jobs are cancelled by the `abort` job above.
      fail-fast: true
      matrix:
        os: [macos-latest, windows-latest]
    # These two jobs are required status checks on the pull request head, and
    # `main` has no `push` run to repeat them: macOS bills 10x and Windows 2x
    # to re-test a tree that is already green. A release cut started with
    # `workflow_dispatch` has no PR behind it, so it still builds both hosts.
    # The guard also keeps any future push event from repeating the matrix.
    if: ${{ github.event_name != 'push' }}
    # A hung macOS/Windows job must not sit until the 360-minute default either.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Plain pip rather than pixi: pixi.lock is linux-64 only, and a pip
      # install proves the package builds and runs without the conda prefix.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Track the minor version pinned in pixi.toml without requiring the
          # runner tool cache to carry that exact patch release.
          python-version: "3.14"
          # Warm pip's download cache from the dependency declaration so warm
          # runs skip re-resolving the dev extra's wheels (TASK-34).
          cache: pip
          cache-dependency-path: |
            packages/qgis-sdk-runtime/pyproject.toml
            packages/qgis-sdk-tools/pyproject.toml
            packages/qgis-sdk-python/pyproject.toml

      # The runtime and the tools are editable so the suite imports the working
      # tree; the kit's exact pins on them are then already satisfied by those
      # installs, and `[dev]` adds the suite's own dependencies (decision-35).
      - name: Install Python test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          -e packages/qgis-sdk-runtime -e packages/qgis-sdk-tools
          -e "packages/qgis-sdk-python[dev]"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Keep in sync with `packageManager` in package.json.
          bun-version: "1.4.2"

      # setup-bun only caches the Bun executable itself; the install store is
      # keyed on the lockfile so warm runs skip re-downloading packages.
      - name: Cache Bun install store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-install-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-install-

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      # The Processing provider modules are generated from catalogue.json
      # (pure Python, no QGIS needed) and never committed; the suite imports
      # them, so they are generated here first.
      - name: Generate the Processing provider modules
        run: python packages/qgis-sdk-python/scripts/generate_processing_providers.py

      - name: Test Python SDK
        shell: bash
        run: >-
          python -m pytest -c packages/qgis-sdk-python/pyproject.toml
          packages/qgis-sdk-python/tests -q --junitxml=python-tests.xml

      # Job logs are served from a blob host that some networks cannot read, so
      # report the counts and every failure as annotations the API can return.
      - name: Report Python test results
        if: ${{ !cancelled() }}
        run: python -m automation.results python-tests.xml

      - name: Test TypeScript bridge
        shell: bash
        run: >-
          python -m automation.ci run-log bun-tests.log --
          bun test packages/qgis-sdk-typescript/tests packages/qgis-sdk-alias/tests

      - name: Report TypeScript test results
        if: ${{ !cancelled() }}
        shell: bash
        run: python -m automation.ci report-bun bun-tests.log --title "bun test"

      # The UI elements import the bridge's built entry, so the bridge is
      # built first; `--conditions=browser` is what `@lit/react` needs under
      # bun test (the package's own `test` script passes it the same way).
      # The unscoped `qgis-sdk-ui` alias is tested next to it: its tests pin
      # the alias to the scoped package file for file.
      - name: Test qgis-sdk-ui
        shell: bash
        run: python -m automation.ci bun-ui

      - name: Report qgis-sdk-ui test results
        if: ${{ !cancelled() }}
        shell: bash
        run: python -m automation.ci report-bun bun-ui-tests.log --title "bun test (qgis-sdk-ui)"
