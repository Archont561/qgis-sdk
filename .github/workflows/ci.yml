name: CI

on:
  # `pull_request` already tests every proposed change, so reacting to `push` on the
  # same branch bills the whole matrix twice per push. `push` is therefore limited to
  # the branch whose result release tooling reads. It names `main` literally: trigger
  # filters take no expressions, so a default-branch rename has to change this line
  # (everything inside the jobs uses `github.event.repository.default_branch`).
  push:
    branches: [main]
    # Docs-only and backlog-only changes cannot move a test, a build or a release.
    # These are the paths relock.yml ignores; the two lists are spelled out per
    # trigger instead of shared through an anchor because GitHub parses `on:` with its
    # own quirks, and that cannot be checked locally while runners are unusable.
    paths-ignore:
      - "backlog/**"
      - "AGENTS.md"
  pull_request:
    paths-ignore:
      - "backlog/**"
      - "AGENTS.md"
  workflow_dispatch:

permissions:
  contents: read

# Supersede stale runs: each push to a branch or open PR replaces the previous
# head, so cancel the in-flight run for the old SHA instead of paying for two
# full matrices. Default-branch runs queue behind each other so a landed
# commit's result is never discarded mid-run. (TASK-34)
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  checks:
    runs-on: ubuntu-latest
    # Bound the job: the Actions default is 360 minutes, and a run hung on a step that
    # never finishes is not a result anybody is waiting for.
    timeout-minutes: 20
    steps:
      - name: Checkout
        id: s01
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Pixi
        id: s02
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          environments: >-
            default
            bun
          cache: true
          locked: true

      - name: Install JavaScript dependencies
        id: s03
        run: pixi run -e bun install-js

      - name: Compute commit range
        id: s04
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python scripts/compute_commit_base.py

      - name: Check commit messages
        id: s05
        run: pixi run -e default check-commits

      - name: Lint Python
        id: s06
        run: pixi run -e default lint-python

      - name: Check Python formatting
        id: s07
        run: pixi run -e default format-python-check

      - name: Test skill-creator tooling
        id: s08
        run: pixi run -e default test-skill-creator

      - name: Test release tooling
        id: s09
        run: pixi run -e default test-release-tool

      - name: Verify the scoped versions and the shared contract
        id: s10
        run: pixi run -e default release-verify-versions

      # The generated clients are source: it is reviewed like any other file, and
      # nothing may edit it by hand. A stale copy fails here with the command that
      # regenerates it, and the `git status` sweep catches a file the generator
      # renamed or stopped writing, which a byte comparison alone would miss.
      # (TASK-17 AC 3)
      - name: Check the generated bridge clients are current
        id: s19
        run: |
          python packages/qgis-sdk-python/scripts/generate_bridge_clients.py
          # Both artifacts: the plugin client under tests, and the host module the
          # package ships under src. A generator that stopped writing one of them
          # shows up as an unexpected deletion, not as a stale byte comparison.
          generated=$(git status --porcelain -- packages/qgis-sdk-typescript)
          if [ -n "$generated" ]; then
            git --no-pager diff -- packages/qgis-sdk-typescript
            echo "::error title=generated client is stale::Run \`python packages/qgis-sdk-python/scripts/generate_bridge_clients.py\` and commit the result."
            exit 1
          fi

      # The default environment carries the QGIS feature, so this is the only
      # place the native layers actually execute against real Qt and QGIS: the
      # native form path, the QGIS network transport, the restricted WebEngine
      # page and its WebChannel binding, the thread-pool job workers and the
      # native service backends. A developer machine needs a display setup and
      # this sandbox has no Qt at all. `-m native` is the umbrella marker that
      # tests/conftest.py derives from the `qt`, `qgis`, `webengine` and
      # `desktop` layers (TASK-7); the network and browser files talk to
      # loopback servers only (TASK-5 AC 3, TASK-20 AC 3); the browser file
      # sets the Chromium flags the TASK-23 headless harness qualified; the
      # jobs file proves GUI-thread delivery over a real QThreadPool (TASK-15).
      - name: Test the native layers offscreen
        id: s11
        env:
          QT_QPA_PLATFORM: offscreen
          QGIS_SDK_NATIVE_SERVICES: "1"
        run: |
          set -o pipefail
          log=native-layers.log
          status=0
          pixi run -e default python -m pytest -c packages/qgis-sdk-python/pyproject.toml packages/qgis-sdk-python/tests -m native -q -rs 2>&1 | tee "$log" || status=$?
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          # pytest 9 exits 5 when a module skips itself during import, which is
          # the honest outcome on a host without usable Qt and QGIS bindings, so
          # that case is a warning carrying the reason rather than a red build.
          reason=$(grep -o "native \(forms\|networking\|WebEngine\|WebChannel\|jobs\) need.*" "$log" | head -1 || true)
          if [ "$status" -eq 5 ] && [ -n "$reason" ]; then
            echo "::warning::native layers did not run: $reason"
            exit 0
          fi
          # Log archives are not reliably downloadable from every client, so the
          # evidence goes into an annotation instead: one red step that says only
          # "exit code 1" has already cost this project a rerun.
          annotate() {
            local title="$1" body="$2"
            body="${body//'%'/'%25'}"
            body="${body//$'\r'/}"
            body="${body//$'\n'/'%0A'}"
            printf '::error title=%s::%s\n' "$title" "$body"
          }
          # `run:` uses bash -e, so a failing substitution would abort before the
          # annotation is printed; every capture here is allowed to fail.
          environment=$(pixi run -e default python -c 'import sys, pathlib; sys.path.insert(0, str(pathlib.Path(sys.prefix) / "share" / "qgis" / "python")); print(sys.version); import PyQt6, qgis.core; print(PyQt6.__file__); print(qgis.core.Qgis.version())' 2>&1 | tail -20 || true)
          annotate "native layers: environment" "$environment"
          annotate "native layers: pytest" "$(tail -60 "$log" || true)"
          exit "$status"

      # The reference plugin is a plugin project, not part of the SDK suite: it
      # runs through its own `qgis-sdk test`, the pure target on the SDK fakes
      # and the `qgis` target on the headless QGIS above (TASK-22 AC 2). The
      # page, `build` and `dev` halves stay in the opt-in harness (doc-14).
      - name: Test the reference plugin through qgis-sdk test
        id: s20
        run: pixi run -e default test-reference-example

      - name: Lint and format TypeScript
        id: s12
        run: pixi run -e bun biome-check

      - name: Lint GitHub Actions
        id: s13
        run: pixi run -e default lint-github-actions

      - name: Typecheck TypeScript
        id: s14
        run: pixi run -e bun typecheck

      - name: Check coverage for all packages
        id: coverage
        run: |
          set -o pipefail
          pixi run -e bun bun run coverage 2>&1 | tee coverage-output.log

      - name: Annotate the coverage failure
        id: s15
        if: failure() && steps.coverage.outcome == 'failure'
        run: |
          # The job log is not always retrievable, but annotations are: surface
          # the failing lines so a red coverage step says what broke.
          grep -nE 'FAILED|ERROR|Error|error:|Coverage|TOTAL|no tests ran' coverage-output.log \
            | tail -40 | cut -c1-900 \
            | while IFS= read -r line; do echo "::error::$line"; done

      - name: Upload Python coverage
        id: s16
        if: ${{ !cancelled() && steps.coverage.outcome == 'success' }}
        # v6+ is the first codecov major whose embedded github-script targets
        # node24; v5 makes fresh runs emit Node 20 deprecation warnings.
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: packages/qgis-sdk-python/coverage/lcov.info
          flags: qgis-sdk-python
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload TypeScript coverage
        id: s17
        if: ${{ !cancelled() && steps.coverage.outcome == 'success' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/qgis-sdk-typescript/lcov.info
          flags: qgis-sdk-typescript
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  # Portable Python/TypeScript suites on the other supported host platforms.
  # This is compatibility evidence only: it is not QGIS Desktop, WebEngine or
  # plugin-coexistence qualification (see TASK-33), and it does not repeat the
  # coverage gate or Codecov uploads owned by `checks`.


      # A red job whose report is only "exit code 1" costs a rerun to diagnose,
      # and the log archive is not reachable from every client. Every step above
      # carries an id so this can name the one that actually failed.
      - name: Report the failed step
        id: s18
        if: failure()
        env:
          STEPS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os
          steps = json.loads(os.environ["STEPS"])
          for name, info in steps.items():
              if info.get("conclusion") not in ("success", "skipped", None):
                  print(f"::error title=failed step::{name}")
          PY
  cross-platform:
    name: cross-platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    # A push to the default branch is the merge of a head that already passed this
    # matrix: macOS bills 10x and Windows 2x to re-test a tree that is already green.
    # `checks` keeps running on every push to main because its coverage artifact and
    # commit-message provenance are what the release path reads. PR runs and
    # `workflow_dispatch` release runs are untouched, so a release cut without a pull
    # request still builds both hosts.
    if: ${{ github.event_name != 'push' }}
    # A hung macOS/Windows job must not sit until the 360-minute default either.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Plain pip rather than pixi: pixi.lock is linux-64 only, and a pip
      # install proves the package builds and runs without the conda prefix.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Track the minor version pinned in pixi.toml without requiring the
          # runner tool cache to carry that exact patch release.
          python-version: "3.14"
          # Warm pip's download cache from the dependency declaration so warm
          # runs skip re-resolving the dev extra's wheels (TASK-34).
          cache: pip
          cache-dependency-path: |
            packages/qgis-sdk-runtime/pyproject.toml
            packages/qgis-sdk-tools/pyproject.toml
            packages/qgis-sdk-python/pyproject.toml

      # The runtime and the tools are editable so the suite imports the working
      # tree; the kit's exact pins on them are then already satisfied by those
      # installs, and `[dev]` adds the suite's own dependencies (decision-35).
      - name: Install Python test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          -e packages/qgis-sdk-runtime -e packages/qgis-sdk-tools
          -e "packages/qgis-sdk-python[dev]"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Keep in sync with `packageManager` in package.json.
          bun-version: "1.4.2"

      # setup-bun only caches the Bun executable itself; the install store is
      # keyed on the lockfile so warm runs skip re-downloading packages.
      - name: Cache Bun install store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-install-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-install-

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Test Python SDK and skill tooling
        shell: bash
        run: >-
          python -m pytest -c packages/qgis-sdk-python/pyproject.toml
          packages/qgis-sdk-python/tests .agents/skills/skill-creator/tests -q
          --junitxml=python-tests.xml

      # Job logs are served from a blob host that some networks cannot read, so
      # report the counts and every failure as annotations the API can return.
      - name: Report Python test results
        if: ${{ !cancelled() }}
        run: python scripts/report_test_results.py python-tests.xml

      - name: Test TypeScript bridge
        shell: bash
        run: |
          # bun writes its summary to stderr; keep both streams and bun's status.
          set -o pipefail
          bun test packages/qgis-sdk-typescript/tests packages/qgis-sdk-alias/tests 2>&1 | tee bun-tests.log

      - name: Report TypeScript test results
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          summary=$(grep -Eo '[0-9]+ pass' bun-tests.log | head -1 || true)
          echo "::notice::bun test: ${summary:-no summary line}"
