name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.11.2
        with:
          environments: >-
            default
            bun
          cache: true
          locked: true

      - name: Install JavaScript dependencies
        run: pixi run -e bun install-js

      - name: Check commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # Review new commits, not already-landed history or the synthetic PR merge.
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            export CONVCO_REV="$BASE_SHA..$GITHUB_SHA"
          else
            # New-branch pushes have an all-zero before SHA; manual runs have none.
            base=$(git merge-base "$GITHUB_SHA" "origin/$DEFAULT_BRANCH")
            if [[ "$base" == "$GITHUB_SHA" ]]; then
              export CONVCO_MAX_COUNT=1
            else
              export CONVCO_REV="$base..$GITHUB_SHA"
            fi
          fi
          pixi run -e default check-commits

      - name: Lint Python
        run: pixi run -e default lint-python

      - name: Check Python formatting
        run: pixi run -e default format-python-check

      - name: Test skill-creator tooling
        run: pixi run -e default test-skill-creator

      - name: Lint and format TypeScript
        run: pixi run -e bun biome-check

      - name: Lint GitHub Actions
        run: pixi run -e default lint-github-actions

      - name: Typecheck TypeScript
        run: pixi run -e bun typecheck

      - name: Check coverage for all packages
        id: coverage
        run: pixi run -e bun bun run coverage

      - name: Upload Python coverage
        if: ${{ !cancelled() && steps.coverage.outcome == 'success' }}
        uses: codecov/codecov-action@v5
        with:
          files: packages/qgis-sdk/coverage/lcov.info
          flags: qgis-sdk
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload TypeScript coverage
        if: ${{ !cancelled() && steps.coverage.outcome == 'success' }}
        uses: codecov/codecov-action@v5
        with:
          files: coverage/qgis-sdk-bridge/lcov.info
          flags: qgis-sdk-bridge
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  # Portable Python/TypeScript suites on the other supported host platforms.
  # This is compatibility evidence only: it is not QGIS Desktop, WebEngine or
  # plugin-coexistence qualification (see TASK-33), and it does not repeat the
  # coverage gate or Codecov uploads owned by `checks`.
  cross-platform:
    name: cross-platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Plain pip rather than pixi: pixi.lock is linux-64 only, and a pip
      # install proves the package builds and runs without the conda prefix.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Track the minor version pinned in pixi.toml without requiring the
          # runner tool cache to carry that exact patch release.
          python-version: "3.14"

      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check -e "packages/qgis-sdk[dev]"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Keep in sync with `packageManager` in package.json.
          bun-version: "1.4.2"

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Test Python SDK and skill tooling
        shell: bash
        run: >-
          python -m pytest -c packages/qgis-sdk/pyproject.toml
          packages/qgis-sdk/tests .agents/skills/skill-creator/tests -q
          --junitxml=python-tests.xml

      # Job logs are served from a blob host that some networks cannot read, so
      # report the counts and every failure as annotations the API can return.
      - name: Report Python test results
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          def find_problem(case):
              """Return the failure or error node of one JUnit test case."""
              problem = case.find("failure")
              return case.find("error") if problem is None else problem

          report = Path("python-tests.xml")
          if not report.exists():
              print("::error::pytest did not write python-tests.xml")
              raise SystemExit(0)
          cases = list(ET.parse(report).iter("testcase"))
          failures = [case for case in cases if find_problem(case) is not None]
          skipped = [case for case in cases if case.find("skipped") is not None]
          print(
              f"::notice::pytest: {len(cases)} collected, "
              f"{len(failures)} failed, {len(skipped)} skipped"
          )
          for case in failures:
              problem = find_problem(case)
              detail = (problem.get("message") or problem.text or "failed").strip()
              first = detail.splitlines()[0][:600]
              print(
                  f"::error file={case.get('file')}::"
                  f"{case.get('classname')}::{case.get('name')}: {first}"
              )
          PY

      - name: Test TypeScript bridge
        shell: bash
        run: |
          # bun writes its summary to stderr; keep both streams and bun's status.
          set -o pipefail
          bun test packages/qgis-sdk-bridge/tests 2>&1 | tee bun-tests.log

      - name: Report TypeScript test results
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          summary=$(grep -Eo '[0-9]+ pass' bun-tests.log | head -1 || true)
          echo "::notice::bun test: ${summary:-no summary line}"
