name: autorelease

# Conventional-commit release train (TASK-35). On every landed push to main the
# stdlib-only qgis-sdk-release tool decides whether a release is due; when one
# is, it pushes an annotated tag that release.yml turns into artifacts.
#
# The push trigger never creates a tag while no *stable* tag exists:
# bootstrapping the train and the first stable release are deliberate
# workflow_dispatch acts (optionally with a prerelease suffix that keeps
# iterating the rc train), so an accidental merge can never consume a registry
# version. Registries only ever see clean vX.Y.Z tags - see release.yml.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Explicit version override (for example 0.1.0). Leave blank to compute
          the next version from conventional commits per .versionrc.
        required: false
        default: ""
      suffix:
        description: >-
          Prerelease suffix appended with a hyphen (for example rc.1). Tags
          carrying a suffix dry-run the registries instead of publishing.
        required: false
        default: ""

permissions:
  contents: write

# Release decisions race on the same history, so runs queue instead of
# cancelling: a cancelled tag push could split the release train in two.
concurrency:
  group: autorelease-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan-and-tag:
    runs-on: ubuntu-latest
    # The decision is a git-log read and a changelog render; the tag is a `git tag`
    # and a push. Both are stdlib work, so the whole job is capped tightly: an
    # unbounded default would bill 360 minutes to a step that should take seconds.
    timeout-minutes: 10
    env:
      # The release tool declares no dependencies and needs only Python >= 3.11, so
      # it runs on the runner's interpreter. Importing it from `src` is exactly what
      # the previous `release-plan` invocation did through the environment manager,
      # minus installing a 279 MB environment to answer "no release is due", which is
      # what most pushes to main ask it to decide.
      PYTHONPATH: ${{ github.workspace }}/packages/qgis-sdk-release/src
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The plan reads every conventional commit since the last tag.
          fetch-depth: 0

      - name: Plan the next release
        id: plan
        run: >-
          python3 -m qgis_sdk_release plan
          --trigger "${{ github.event_name == 'workflow_dispatch' && 'dispatch' || 'push' }}"
          --version-override "${{ github.event.inputs.version || '' }}"
          --suffix "${{ github.event.inputs.suffix || '' }}"
          --json

      - name: Push the release tag
        if: steps.plan.outputs.action == 'tag'
        run: >-
          python3 -m qgis_sdk_release tag
          --tag "${{ steps.plan.outputs.tag }}"
          --message-file "${{ steps.plan.outputs.changelog_file }}"
          --push

      - name: Report a skipped release
        if: steps.plan.outputs.action != 'tag'
        run: >-
          echo "autorelease: ${{ steps.plan.outputs.reason }}"
          >> "$GITHUB_STEP_SUMMARY"
