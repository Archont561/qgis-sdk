name: autorelease

# Conventional-commit and milestone release train (TASK-35, TASK-37). On every
# landed push to main or milestone tag push (milestone-v*, milestone/*, m-v*),
# the stdlib-only scripts/release.py tool decides whether a release is due; when
# one is, it runs pre-release quality gates and pushes an annotated release tag
# that release.yml turns into artifacts.
#
# Two triggers can never consume a version:
#   - A branch push to main is always a DRY RUN. It plans the candidate, runs the
#     quality gates and the packaging check, and stops. Cutting the tag is an
#     explicit act: workflow_dispatch, or a milestone tag. On 2026-10-24 a merge
#     planned `v0.2.0` for both packages - a package minor, from a `feat!` - and
#     only luck kept it from tagging; `resolve_dry_run` now makes that
#     impossible.
#   - No *stable* tag exists yet. Bootstrapping the train is likewise a dispatch
#     or milestone-tag act (optionally with a prerelease suffix that keeps
#     iterating the rc train).
# Registries only ever see clean release tags - see release.yml.

on:
  push:
    branches:
      - main
    tags:
      - "milestone-v*"
      - "milestone/*"
      - "m-v*"
    paths-ignore:
      - "backlog/**"
      - ".agents/**"
      - ".devcontainer/**"
      - "*.md"
  workflow_dispatch:
    inputs:
      scope:
        description: >-
          Target scope: auto (default) derives it from the changed paths;
          set python, typescript or all to force one.
        required: false
        default: "auto"
        type: string
      bump:
        description: >-
          Force version bump (leave blank for conventional-commit
          auto-calculation: patch, minor, major, or explicit X.Y.Z).
        required: false
        default: ""
        type: string
      dry-run:
        description: >-
          Dry run: detect changes and verify quality gates without pushing
          tags.
        required: false
        default: false
        type: boolean
      version:
        description: >-
          Explicit version override (for example 0.1.0). Leave blank to compute
          the next version from conventional commits per .versionrc.
        required: false
        default: ""
        type: string
      suffix:
        description: >-
          Prerelease suffix appended with a hyphen (for example rc.1). Tags
          carrying a suffix dry-run the registries instead of publishing.
        required: false
        default: ""
        type: string

permissions:
  contents: write

# Release decisions race on the same history, so runs queue instead of
# cancelling: a cancelled tag push could split the release train in two.
concurrency:
  group: autorelease-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan-and-tag:
    runs-on: ubuntu-latest
    # Planning is stdlib-only and exits in seconds when no release is due; when
    # a release is planned, pre-release quality gates run in the locked Pixi
    # environments before cutting the release tag.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The plan reads every conventional commit since the last tag.
          fetch-depth: 0

      - name: Plan the next release
        id: plan
        env:
          # A milestone tag carries its own scope; every other trigger derives
          # the scope from the changed paths, so a Python-only push plans a
          # python-v* release instead of an alignment one.
          RELEASE_SCOPE: ${{ github.ref_type == 'tag' && '' || inputs.scope || 'auto' }}
        run: >-
          python3 scripts/release.py plan
          --trigger "${{ github.event_name == 'workflow_dispatch' && 'dispatch' || (github.ref_type == 'tag' && 'milestone' || 'push') }}"
          --milestone-tag "${{ github.ref_type == 'tag' && github.ref_name || '' }}"
          --scope "$RELEASE_SCOPE"
          --bump "${{ inputs.bump || '' }}"
          --version-override "${{ inputs.version || '' }}"
          --suffix "${{ inputs.suffix || '' }}"
          --dry-run "${{ inputs.dry-run && 'true' || 'false' }}"
          --json

      - name: Set up Pixi for pre-release quality gates
        if: steps.plan.outputs.action == 'tag'
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.81.0
          environments: >-
            default
            build
            bun
          cache: true
          locked: true

      - name: Cache Bun install store
        if: steps.plan.outputs.action == 'tag' && steps.plan.outputs.typescript == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-install-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-install-

      - name: Install JavaScript dependencies
        if: steps.plan.outputs.action == 'tag' && steps.plan.outputs.typescript == 'true'
        run: pixi run -e bun install-js

      - name: Run quality gate
        if: steps.plan.outputs.action == 'tag'
        run: |
          SCOPE="${{ steps.plan.outputs.scope }}"
          echo "Executing pre-release quality gates for scope: $SCOPE"
          if [ "$SCOPE" = "all" ]; then
            pixi run -e default lint-python
            pixi run -e default format-python-check
            pixi run -e default test-release-tool
            pixi run -e bun biome-check
            pixi run -e bun typecheck
            pixi run -e bun bun run test
          elif [ "$SCOPE" = "python" ]; then
            pixi run -e default lint-python
            pixi run -e default format-python-check
            pixi run -e default test-release-tool
            pixi run -e default python -m pytest -c packages/qgis-sdk/pyproject.toml packages/qgis-sdk/tests -q
          elif [ "$SCOPE" = "typescript" ]; then
            pixi run -e bun biome-check
            pixi run -e bun typecheck
            pixi run -e bun bun test packages/qgis-sdk-bridge/tests
          fi

      - name: Dry-run packaging check
        if: steps.plan.outputs.action == 'tag'
        run: |
          if [ "${{ steps.plan.outputs.python }}" = "true" ]; then
            pixi run -e build release-build-python
            pixi run -e build release-build-conda
          fi
          if [ "${{ steps.plan.outputs.typescript }}" = "true" ]; then
            pixi run -e bun bun run --filter '@archont561/qgis-sdk-bridge' build
          fi

      - name: Push the release tag
        if: steps.plan.outputs.action == 'tag' && steps.plan.outputs.dry_run != 'true'
        run: >-
          python3 scripts/release.py tag
          --tag "${{ steps.plan.outputs.tag }}"
          --message-file "${{ steps.plan.outputs.changelog_file }}"
          --push

      - name: Report dry-run release
        if: steps.plan.outputs.action == 'tag' && steps.plan.outputs.dry_run == 'true'
        run: >-
          echo "autorelease dry-run: would push ${{ steps.plan.outputs.tag }} (scope: ${{ steps.plan.outputs.scope }})"
          >> "$GITHUB_STEP_SUMMARY"

      - name: Report a skipped release
        if: steps.plan.outputs.action != 'tag'
        run: >-
          echo "autorelease: ${{ steps.plan.outputs.reason }}"
          >> "$GITHUB_STEP_SUMMARY"
