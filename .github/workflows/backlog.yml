name: backlog

# The backlog guards, on the paths that change the board.
#
# `tests/scripts/test_backlog.py` keeps the board honest - links, `milestone:`
# against `doc-4`, id uniqueness - in seconds, without the SDK installed. It
# runs on every pull request that touches the backlog, alongside the full CI
# matrix: branch protection requires the `ci.yml` checks on every pull request,
# so `ci.yml` cannot use a `paths-ignore` filter without leaving a required
# check Pending. This workflow keeps the narrow, cheap guard in its own home.
#
# Deliberately narrow, and not a second home for tests: a check that needs the
# SDK installed, QGIS, or a browser stays in `ci.yml`. This job installs pytest
# and nothing else, and finishes in seconds.

on:
  pull_request:
    # One readable list, spelled out rather than shared through an anchor:
    # trigger filters take no expressions.
    paths:
      - "backlog/**"
      - "tests/scripts/test_backlog.py"
      - "tests/scripts/pyproject.toml"
      - ".github/workflows/backlog.yml"
  workflow_dispatch:

permissions:
  contents: read

# The result nobody is waiting for: a superseded commit on the same branch is
# cancelled rather than queued behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    name: backlog drift
    runs-on: ubuntu-latest
    # The Actions default is 360 minutes. Nothing here can legitimately take ten.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Plain pip rather than pixi: this job needs pytest and no lockfile, and
      # solving the pixi environment would cost more than the test it runs
      # (TASK-34).
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      # Pinned to the pytest the locked environment carries, so this job and the
      # `test_scripts` task it stands in for cannot disagree about what a
      # passing test is.
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check "pytest==9.1.1"

      # The file reads the repository as data. It imports no package code, so
      # nothing needs installing and no PYTHONPATH is set.
      - name: Run the backlog guards
        run: >-
          python -m pytest -c tests/scripts/pyproject.toml
          tests/scripts/test_backlog.py -q
