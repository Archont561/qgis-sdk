name: release

# Artifact pipeline for every release tag (TASK-35, TASK-37). Builds the
# Python wheels and/or the @archont561/qgis-sdk npm package according to the
# tag scope (v*, <scope>-v*, <scope>/v*), publishes a GitHub Release with
# SHA256SUMS, and hands the artifacts to the registries.
#
# The packages version independently (decision-25, decision-35): `python-v*`
# is the Python kit train and stamps the kit `qgis-sdk`, `qgis-sdk-runtime`
# and `qgis-sdk-tools` at one version; `runtime-v*` and `tools-v*` stamp one
# of those distributions alone; `ts-v*` stamps only the bridge package.json;
# `v*` is an alignment release that stamps everything at one version. What
# ties a pair together is the plugin-description contract version, which
# `release-verify-versions` checks across the Python declarations and the
# bridge declarations on every release. Each Python distribution is published by its
# own step from its own directory (dist/pypi/<runtime|tools|kit>), so a
# failure names the wheel it belongs to.
#
# Registry publishing runs under the OIDC trusted-publishing bindings the
# repository owner provisioned: PyPI projects `qgis-sdk`, `qgis-sdk-runtime`
# and `qgis-sdk-tools` accept tokens from this workflow file (release.yml)
# under GitHub environment `pypi`, and npm
# packages `@archont561/qgis-sdk`, `qgis-sdk`, `@archont561/qgis-sdk-ui` and
# `qgis-sdk-ui` from release.yml under environment `npm`
# (the binding is per package name: the one provisioned for the former
# `qgis-sdk-bridge` does not carry over, see decision-33). Renaming this file
# or those environments breaks publishing. Prerelease tags
# (vX.Y.Z-suffix) dry-run both registries instead of uploading, so version
# space is only consumed by a deliberate clean release.
#
# `ui-v*` tags are the web components' own train (decision-47, TASK-110):
# the `ui` job packs `@archont561/qgis-sdk-ui` and its unscoped alias
# `qgis-sdk-ui`, checks the tarball holds `dist`, `README.md` and `LICENSE`
# only, and publishes both; it never touches the bridge, PyPI or Conda.

on:
  push:
    tags:
      - "v*"
      - "*-v*"
      - "*/*v*"
      - "!milestone-v*"
      - "!milestone/*"
      - "!m-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Release tag to publish (for example v0.1.0, python-v0.1.0,
          runtime-v0.1.0, tools-v0.1.0, or ts-v0.1.0).
        required: false
        default: ""
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.classify.outputs.version }}
      prerelease: ${{ steps.classify.outputs.prerelease }}
      scope: ${{ steps.classify.outputs.scope }}
      # `python` is "at least one Python distribution"; the three flags below
      # name them so the publish steps are one per wheel.
      python: ${{ steps.classify.outputs.python }}
      kit: ${{ steps.classify.outputs.kit }}
      runtime: ${{ steps.classify.outputs.runtime }}
      tools: ${{ steps.classify.outputs.tools }}
      typescript: ${{ steps.classify.outputs.typescript }}
      ui: ${{ steps.classify.outputs.ui }}
      tag_name: ${{ steps.classify.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.81.0
          environments: >-
            build
            bun
          cache: true
          locked: true

      - name: Classify the tag
        id: classify
        run: >-
          pixi run -e build release-classify
          --tag "${{ inputs.tag || github.ref_name }}"
          --scoped

      - name: Cache Bun install store
        if: steps.classify.outputs.typescript == 'true' || steps.classify.outputs.ui == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-install-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-install-

      - name: Install JavaScript dependencies
        if: steps.classify.outputs.typescript == 'true' || steps.classify.outputs.ui == 'true'
        run: pixi run -e bun install-js

      - name: Stamp the released package
        run: >-
          pixi run -e build release-stamp
          --version "${{ steps.classify.outputs.version }}"
          --scope "${{ steps.classify.outputs.scope }}"

      # The release compatibility gate (TASK-9). The four steps below are the
      # checks a release must pass before anything is uploaded: the scoped
      # manifests agree on the version, the tools' runtime range holds the
      # runtime next to them and both sides of the bridge contract agree
      # (verify-versions); the support matrix the kit claims is recorded with
      # the run; the wheels build and pass `twine check` (build-python, and
      # again in each publish job before the upload); the Conda package
      # builds from the same tree.
      # The locked Pixi environments this job installs with `locked: true`
      # are the lockfile check: a stale `pixi.lock` fails the job before any
      # of this runs, and relock.yml is what moves the lock.
      - name: Verify the stamped manifests and the shared contract
        run: >-
          pixi run -e build release-verify-versions
          --scope "${{ steps.classify.outputs.scope }}"
          --version "${{ steps.classify.outputs.version }}"

      - name: Record the support matrix the release is qualified on
        run: |
          {
            echo "## Support matrix"
            echo
            pixi run -e build python -m qgis_sdk_tools targets
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build and check the Python wheels the scope ships
        if: steps.classify.outputs.python == 'true'
        run: >-
          pixi run -e build release-build-python
          --scope "${{ steps.classify.outputs.scope }}"

      - name: Build the Conda package
        if: steps.classify.outputs.python == 'true'
        run: pixi run -e build release-build-conda

      # The components import the bridge's built entry, so a UI release
      # builds the bridge too; the bridge tarball only feeds the UI job's
      # smoke install and is never published from a `ui-v*` tag.
      - name: Build the TypeScript bridge
        if: steps.classify.outputs.typescript == 'true' || steps.classify.outputs.ui == 'true'
        run: pixi run -e bun bun run --filter '@archont561/qgis-sdk' build

      - name: Build the web components
        if: steps.classify.outputs.ui == 'true'
        run: pixi run -e bun bun run --filter '@archont561/qgis-sdk-ui' build

      - name: Capture the tag annotation as release notes
        env:
          RELEASE_TAG: ${{ steps.classify.outputs.tag_name }}
        run: |
          git tag -l --format='%(contents)' "$RELEASE_TAG" > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release $RELEASE_TAG" > release-notes.md
          fi

      - name: Upload wheel artifact
        if: steps.classify.outputs.python == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          # One subdirectory per distribution (runtime/, tools/, kit/).
          path: dist/pypi

      - name: Upload Conda package artifact
        if: steps.classify.outputs.python == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conda-dist
          path: dist/conda/noarch/*.conda
          if-no-files-found: error

      - name: Upload bridge package artifact
        if: steps.classify.outputs.typescript == 'true' || steps.classify.outputs.ui == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bridge-package
          path: |
            packages/qgis-sdk-typescript/package.json
            packages/qgis-sdk-typescript/README.md
            packages/qgis-sdk-typescript/LICENSE
            packages/qgis-sdk-typescript/dist

      - name: Upload alias package artifact
        if: steps.classify.outputs.typescript == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: alias-package
          path: |
            packages/qgis-sdk-alias/package.json
            packages/qgis-sdk-alias/README.md
            packages/qgis-sdk-alias/LICENSE
            packages/qgis-sdk-alias/*.js
            packages/qgis-sdk-alias/*.d.ts

      - name: Upload UI package artifact
        if: steps.classify.outputs.ui == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-package
          path: |
            packages/qgis-sdk-ui/package.json
            packages/qgis-sdk-ui/README.md
            packages/qgis-sdk-ui/LICENSE
            packages/qgis-sdk-ui/dist

      - name: Upload UI alias package artifact
        if: steps.classify.outputs.ui == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-alias-package
          path: |
            packages/qgis-sdk-ui-alias/package.json
            packages/qgis-sdk-ui-alias/README.md
            packages/qgis-sdk-ui-alias/LICENSE
            packages/qgis-sdk-ui-alias/*.js
            packages/qgis-sdk-ui-alias/*.d.ts
            packages/qgis-sdk-ui-alias/*.css

      - name: Upload release notes artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md

  pypi:
    needs: build
    if: needs.build.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Trusted-publishing binding: PyPI projects `qgis-sdk`, `qgis-sdk-runtime`
    # and `qgis-sdk-tools` accept OIDC tokens from release.yml running under
    # the `pypi` environment only. A job-level permissions block replaces the
    # workflow-level one, so id-token is named here explicitly (the trap
    # publish-sandbox.yml documents). One publish step per distribution, in
    # dependency order: the kit pins the other two, so it goes last.
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      # Only the prerelease dry-run reads the repository: it verifies the wheel with the
      # workspace's own release tool, which needs the manifest to set up Pixi. A clean
      # publish consumes nothing but the downloaded artifact, so checkout and the
      # environment install are gated on the same condition as that verify step
      # instead of being paid on every real release.
      - name: Checkout
        if: needs.build.outputs.prerelease == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download wheel artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist/pypi

      - name: Set up Pixi
        if: needs.build.outputs.prerelease == 'true'
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.81.0
          environments: build
          cache: true
          locked: true

      - name: Verify the wheel without uploading
        if: needs.build.outputs.prerelease == 'true'
        run: |
          pixi run -e build release-verify-python --dist dist/pypi
          echo "PyPI upload skipped: ${{ needs.build.outputs.version }} is a prerelease; registries only accept clean tags." >> "$GITHUB_STEP_SUMMARY"

      - name: Publish qgis-sdk-runtime to PyPI
        if: needs.build.outputs.prerelease == 'false' && needs.build.outputs.runtime == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/pypi/runtime
          skip-existing: true

      - name: Publish qgis-sdk-tools to PyPI
        if: needs.build.outputs.prerelease == 'false' && needs.build.outputs.tools == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/pypi/tools
          skip-existing: true

      - name: Publish qgis-sdk to PyPI
        if: needs.build.outputs.prerelease == 'false' && needs.build.outputs.kit == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/pypi/kit
          skip-existing: true

  conda:
    needs: build
    if: needs.build.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Trusted-publishing binding: prefix.dev channel `archont561/archont561`
    # accepts OIDC tokens from release.yml running under the `prefix`
    # environment with `id-token: write`.
    environment: prefix
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Conda package artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: conda-dist
          path: dist/conda

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.81.0
          environments: build
          cache: true
          locked: true

      - name: Skip prefix.dev upload for prereleases
        if: needs.build.outputs.prerelease == 'true'
        run: |
          echo "prefix.dev upload skipped: ${{ needs.build.outputs.version }} is a prerelease; registries only accept clean tags." >> "$GITHUB_STEP_SUMMARY"

      - name: Verify GitHub OIDC permission
        if: needs.build.outputs.prerelease == 'false'
        shell: bash
        run: ': "${ACTIONS_ID_TOKEN_REQUEST_URL:?missing GitHub OIDC request URL; grant permissions.id-token: write}" && : "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:?missing GitHub OIDC request token; grant permissions.id-token: write}"'

      # The recipe builds all three outputs every time; only the ones the tag
      # ships are uploaded, so a runtime-only tag never re-publishes the kit.
      - name: Publish qgis-sdk-runtime to prefix.dev
        if: needs.build.outputs.prerelease == 'false' && needs.build.outputs.runtime == 'true'
        run: pixi run -e build publish-conda "dist/conda/qgis-sdk-runtime-*.conda"

      - name: Publish qgis-sdk-tools to prefix.dev
        if: needs.build.outputs.prerelease == 'false' && needs.build.outputs.tools == 'true'
        run: pixi run -e build publish-conda "dist/conda/qgis-sdk-tools-*.conda"

      - name: Publish qgis-sdk to prefix.dev
        if: needs.build.outputs.prerelease == 'false' && needs.build.outputs.kit == 'true'
        run: pixi run -e build publish-conda "dist/conda/qgis-sdk-${{ needs.build.outputs.version }}-*.conda"

  npm:
    needs: build
    if: needs.build.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Trusted-publishing bindings: npm packages `@archont561/qgis-sdk` and its
    # unscoped alias `qgis-sdk` (decision-33) each accept OIDC tokens from
    # release.yml running under the `npm` environment only; a binding is per
    # package name, so both are provisioned. npm trusted publishing needs
    # npm >= 11.5.1, so the runner's npm is replaced with an exact pin before
    # packing or publishing. The alias is published after the scoped package it
    # pins, so `qgis-sdk@X` never resolves before `@archont561/qgis-sdk@X`.
    environment: npm
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download bridge package artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bridge-package
          path: bridge

      - name: Download alias package artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: alias-package
          path: alias

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Pin npm to an OIDC-capable version
        run: |
          npm install -g npm@12.2.0
          npm --version

      - name: Pack the bridge tarball
        working-directory: bridge
        run: |
          npm pkg delete devDependencies
          npm pack

      - name: Pack the alias tarball
        working-directory: alias
        run: npm pack

      # The alias re-exports the bridge through its exact pin; prove the pair
      # installs and resolves from the tarballs before either is published.
      - name: Smoke-test the alias against the bridge tarball
        run: |
          mkdir -p smoke
          cat > smoke/mirror.mjs <<'EOF'
          const entries = ["", "/bridge", "/host", "/testing"];
          for (const entry of entries) {
            const scoped = Object.keys(await import(`@archont561/qgis-sdk${entry}`)).sort();
            const alias = Object.keys(await import(`qgis-sdk${entry}`)).sort();
            if (JSON.stringify(scoped) !== JSON.stringify(alias) || scoped.length === 0) {
              throw new Error(`qgis-sdk${entry} does not mirror @archont561/qgis-sdk${entry}`);
            }
            console.log(`qgis-sdk${entry}: ${alias.length} exports mirrored`);
          }
          EOF
          cd smoke
          npm init -y >/dev/null
          npm install --no-audit --no-fund --ignore-scripts ../bridge/*.tgz ../alias/*.tgz
          node mirror.mjs

      - name: Upload tarball artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tgz
          path: |
            bridge/*.tgz
            alias/*.tgz

      - name: Dry-run the publish
        if: needs.build.outputs.prerelease == 'true'
        working-directory: bridge
        run: |
          set -o pipefail
          # npm refuses to publish a prerelease without an explicit dist-tag,
          # even for a dry run; `next` keeps `latest` untouched.
          npm publish --dry-run --access public --tag next ./*.tgz 2>&1 | tee ../npm-publish.log
          npm publish --dry-run --access public --tag next ../alias/*.tgz 2>&1 | tee -a ../npm-publish.log
          echo "npm publish skipped: ${{ needs.build.outputs.version }} is a prerelease (dry-run only, dist-tag next, both names)." >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to npm
        if: needs.build.outputs.prerelease == 'false'
        working-directory: bridge
        run: |
          set -o pipefail
          if [ "$(npm view "@archont561/qgis-sdk@${{ needs.build.outputs.version }}" version --registry=https://registry.npmjs.org 2>/dev/null || true)" = "${{ needs.build.outputs.version }}" ]; then
            echo "npm already has @archont561/qgis-sdk@${{ needs.build.outputs.version }}; skipping."
          else
            npm publish --provenance --access public --loglevel verbose ./*.tgz 2>&1 | tee ../npm-publish.log
          fi

      - name: Publish the alias to npm
        if: needs.build.outputs.prerelease == 'false'
        working-directory: alias
        run: |
          set -o pipefail
          if [ "$(npm view "qgis-sdk@${{ needs.build.outputs.version }}" version --registry=https://registry.npmjs.org 2>/dev/null || true)" = "${{ needs.build.outputs.version }}" ]; then
            echo "npm already has qgis-sdk@${{ needs.build.outputs.version }}; skipping."
          else
            npm publish --provenance --access public --loglevel verbose ./*.tgz 2>&1 | tee -a ../npm-publish.log
          fi

      # Job log blobs are served from a host some networks cannot read, so a
      # failing publish reports its npm output as annotations (the ci.yml
      # cross-platform pattern) instead of leaving the failure unexplainable.
      - name: Report npm publish output on failure
        if: failure()
        run: |
          if [ -f npm-publish.log ]; then
            grep -iE 'oidc|ENEEDAUTH|E40|error' npm-publish.log | tail -n 15 | while IFS= read -r line; do
              echo "::error::npm publish: $line"
            done
          fi

  # The web components' train (decision-47, TASK-110). Trusted-publishing
  # bindings: npm packages `@archont561/qgis-sdk-ui` and its unscoped alias
  # `qgis-sdk-ui` each accept OIDC tokens from release.yml under the `npm`
  # environment. The alias is published after the scoped package it pins,
  # so `qgis-sdk-ui@X` never resolves before `@archont561/qgis-sdk-ui@X`.
  ui:
    needs: build
    if: needs.build.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download UI package artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-package
          path: ui

      - name: Download UI alias package artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-alias-package
          path: ui-alias

      # The bridge built in the same run feeds the smoke install below, so
      # the check never depends on which bridge npm holds today.
      - name: Download bridge package artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bridge-package
          path: bridge

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Pin npm to an OIDC-capable version
        run: |
          npm install -g npm@12.2.0
          npm --version

      # `files` whitelists dist, README.md and LICENSE; the dry run lists
      # what the tarball would hold, and anything outside that set (a source,
      # a story, a test) fails the release before it is packed.
      - name: Pack the UI tarball and check what it holds
        working-directory: ui
        run: |
          set -o pipefail
          npm pkg delete devDependencies scripts
          npm pack --dry-run --json > ../ui-pack.json
          node - <<'EOF'
          const [pack] = JSON.parse(require("node:fs").readFileSync("../ui-pack.json", "utf8"));
          const allowed = (path) =>
            path.startsWith("dist/") || ["package.json", "README.md", "LICENSE"].includes(path);
          const outside = pack.files.map((f) => f.path).filter((path) => !allowed(path));
          if (outside.length > 0) {
            throw new Error(`the UI tarball holds more than dist, README and LICENSE: ${outside.join(", ")}`);
          }
          for (const required of ["package.json", "README.md", "LICENSE", "dist/index.js", "dist/define.js", "dist/style.css", "dist/tokens.css"]) {
            if (!pack.files.some((f) => f.path === required)) {
              throw new Error(`the UI tarball lacks ${required}`);
            }
          }
          console.log(`${pack.name}@${pack.version}: ${pack.files.length} files, all under dist/ plus package.json, README.md, LICENSE`);
          EOF
          npm pack

      - name: Pack the alias tarball
        working-directory: ui-alias
        run: npm pack

      - name: Pack the bridge for the smoke install
        working-directory: bridge
        run: |
          npm pkg delete devDependencies
          npm pack

      # The alias re-exports the components through its exact pin; prove the
      # pair installs and resolves from the tarballs before either is
      # published. Lit needs a DOM to import, so happy-dom stands in for the
      # page; the framework entries need their peers and are left to the
      # alias tests in CI.
      - name: Smoke-test the alias against the UI tarball
        run: |
          mkdir -p smoke
          cat > smoke/mirror.mjs <<'EOF'
          import { GlobalRegistrator } from "@happy-dom/global-registrator";
          GlobalRegistrator.register();
          const entries = ["", "/define"];
          for (const entry of entries) {
            const scoped = Object.keys(await import(`@archont561/qgis-sdk-ui${entry}`)).sort();
            const alias = Object.keys(await import(`qgis-sdk-ui${entry}`)).sort();
            if (JSON.stringify(scoped) !== JSON.stringify(alias) || scoped.length === 0) {
              throw new Error(`qgis-sdk-ui${entry} does not mirror @archont561/qgis-sdk-ui${entry}`);
            }
            console.log(`qgis-sdk-ui${entry}: ${alias.length} exports mirrored`);
          }
          for (const sheet of ["style.css", "tokens.css"]) {
            const scoped = import.meta.resolve(`@archont561/qgis-sdk-ui/${sheet}`);
            const alias = import.meta.resolve(`qgis-sdk-ui/${sheet}`);
            const text = (await import("node:fs")).readFileSync(new URL(alias), "utf8");
            if (!text.includes(`@import "@archont561/qgis-sdk-ui/${sheet}"`) || !scoped.endsWith(sheet)) {
              throw new Error(`qgis-sdk-ui/${sheet} does not import the scoped stylesheet`);
            }
            console.log(`qgis-sdk-ui/${sheet}: imports the scoped stylesheet`);
          }
          await GlobalRegistrator.unregister();
          EOF
          cd smoke
          npm init -y >/dev/null
          npm install --no-audit --no-fund --ignore-scripts ../bridge/*.tgz ../ui/*.tgz ../ui-alias/*.tgz @happy-dom/global-registrator
          node mirror.mjs

      - name: Upload tarball artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-npm-tgz
          path: |
            ui/*.tgz
            ui-alias/*.tgz

      - name: Dry-run the publish
        if: needs.build.outputs.prerelease == 'true'
        working-directory: ui
        run: |
          set -o pipefail
          # npm refuses to publish a prerelease without an explicit dist-tag,
          # even for a dry run; `next` keeps `latest` untouched.
          npm publish --dry-run --access public --tag next ./*.tgz 2>&1 | tee ../npm-publish.log
          npm publish --dry-run --access public --tag next ../ui-alias/*.tgz 2>&1 | tee -a ../npm-publish.log
          echo "npm publish skipped: ${{ needs.build.outputs.version }} is a prerelease (dry-run only, dist-tag next, both names)." >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to npm
        if: needs.build.outputs.prerelease == 'false'
        working-directory: ui
        run: |
          set -o pipefail
          if [ "$(npm view "@archont561/qgis-sdk-ui@${{ needs.build.outputs.version }}" version --registry=https://registry.npmjs.org 2>/dev/null || true)" = "${{ needs.build.outputs.version }}" ]; then
            echo "npm already has @archont561/qgis-sdk-ui@${{ needs.build.outputs.version }}; skipping."
          else
            npm publish --provenance --access public --loglevel verbose ./*.tgz 2>&1 | tee ../npm-publish.log
          fi

      - name: Publish the alias to npm
        if: needs.build.outputs.prerelease == 'false'
        working-directory: ui-alias
        run: |
          set -o pipefail
          if [ "$(npm view "qgis-sdk-ui@${{ needs.build.outputs.version }}" version --registry=https://registry.npmjs.org 2>/dev/null || true)" = "${{ needs.build.outputs.version }}" ]; then
            echo "npm already has qgis-sdk-ui@${{ needs.build.outputs.version }}; skipping."
          else
            npm publish --provenance --access public --loglevel verbose ./*.tgz 2>&1 | tee -a ../npm-publish.log
          fi

      - name: Report npm publish output on failure
        if: failure()
        run: |
          if [ -f npm-publish.log ]; then
            grep -iE 'oidc|ENEEDAUTH|E40|error' npm-publish.log | tail -n 15 | while IFS= read -r line; do
              echo "::error::npm publish (ui): $line"
            done
          fi

  # GitHub Packages only accepts names scoped to the repository owner, so the
  # unscoped alias `qgis-sdk` is npm-only; only the scoped package goes here.
  github-packages:
    needs: build
    if: needs.build.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download bridge package artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bridge-package
          path: bridge

      - name: Set up Node for GitHub Packages
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@archont561"

      - name: Strip workspace devDependencies
        working-directory: bridge
        run: npm pkg delete devDependencies

      - name: Dry-run GitHub Packages publish
        if: needs.build.outputs.prerelease == 'true'
        working-directory: bridge
        run: |
          set -o pipefail
          npm publish --dry-run --registry=https://npm.pkg.github.com --tag next 2>&1 | tee ../gh-pkg-publish.log
          echo "GitHub Packages publish skipped: ${{ needs.build.outputs.version }} is a prerelease (dry-run only, dist-tag next)." >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to GitHub Packages
        if: needs.build.outputs.prerelease == 'false'
        working-directory: bridge
        run: |
          set -o pipefail
          if [ "$(npm view "@archont561/qgis-sdk@${{ needs.build.outputs.version }}" version --registry=https://npm.pkg.github.com 2>/dev/null || true)" = "${{ needs.build.outputs.version }}" ]; then
            echo "GitHub Packages already has @archont561/qgis-sdk@${{ needs.build.outputs.version }}; skipping."
          else
            npm publish --registry=https://npm.pkg.github.com 2>&1 | tee ../gh-pkg-publish.log
          fi

      - name: Report GitHub Packages publish output on failure
        if: failure()
        run: |
          if [ -f gh-pkg-publish.log ]; then
            grep -iE 'ENEEDAUTH|E40|error' gh-pkg-publish.log | tail -n 15 | while IFS= read -r line; do
              echo "::error::github-packages publish: $line"
            done
          fi

  github-release:
    needs: [build, pypi, conda, npm, ui, github-packages]
    if: >-
      always() &&
      needs.build.result == 'success' &&
      (needs.pypi.result == 'success' || needs.pypi.result == 'skipped') &&
      (needs.conda.result == 'success' || needs.conda.result == 'skipped') &&
      (needs.npm.result == 'success' || needs.npm.result == 'skipped') &&
      (needs.ui.result == 'success' || needs.ui.result == 'skipped') &&
      (needs.github-packages.result == 'success' || needs.github-packages.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.81.0
          environments: build
          cache: true
          locked: true

      - name: Download wheel artifact
        if: needs.build.outputs.python == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist/pypi

      - name: Download Conda package artifact
        if: needs.build.outputs.python == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: conda-dist
          path: dist/conda

      - name: Download tarball artifact
        if: needs.build.outputs.typescript == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tgz
          path: npm

      - name: Download UI tarball artifact
        if: needs.build.outputs.ui == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-npm-tgz
          path: npm

      - name: Download release notes artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes

      - name: Write SHA256SUMS and publish the GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag_name }}
        run: |
          shopt -s nullglob
          # The npm-tgz artifact carries two tarballs under their pack
          # directories (bridge/, alias/) since the alias shipped; ts-v0.3.0
          # published both and then found no asset under npm/*.tgz. A ui-v*
          # tag downloads ui-npm-tgz (ui/, ui-alias/) into the same place.
          # Wheels sit one directory per distribution (dist/pypi/<name>/).
          assets=(dist/pypi/*/*.whl dist/conda/*.conda npm/*.tgz npm/*/*.tgz)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::no release assets found under dist/ or npm/"
            exit 1
          fi
          # A TypeScript-only tag downloads no wheel, so dist/ does not exist
          # yet; ts-v0.2.0 failed here after npm had already published.
          mkdir -p dist
          pixi run -e build release-checksums --out dist/SHA256SUMS "${assets[@]}"
          pixi run -e build release-github \
            --tag "$RELEASE_TAG" \
            --body-file notes/release-notes.md \
            --asset "${assets[@]}" dist/SHA256SUMS
