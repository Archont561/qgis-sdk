[workspace]
name = "workspace"
channels = ["conda-forge"]
platforms = ["linux-64"]
preview = ["pixi-build"]

[feature.python.dependencies]
python = "==3.14.8"
pytest = "==9.1.1"
rich = "==15.0.0"
typer = "==0.27.3"
python-build = "==1.6.1"
twine = "==7.0.0"
hatchling = "==1.32.4"

# Wheels only: pixi-pack refuses path/sdist PyPI locations, so the workspace package
# stays on PYTHONPATH rather than an editable extra.
[feature.python.pypi-dependencies]
hypothesis = "==6.169.4"
pytest-cov = "==7.1.0"
pytest-bdd = "==9.0.0"
# Test-only contract export/oracle plus the optional controlled-deployment adapter.
mashumaro = "==3.23"
jsonschema = "==4.26.0"
pydantic = "==2.14.1"

[feature.python.activation.env]
# Absolute, so a task or a `qgis-sdk test` subprocess that runs in another
# working directory (the reference example) still imports the source tree.
PYTHONPATH = "$PIXI_PROJECT_ROOT/packages/qgis-sdk-runtime/src:$PIXI_PROJECT_ROOT/packages/qgis-sdk-tools/src"

[feature.python.tasks.test-skill-creator]
cmd = "pytest -q .agents/skills/skill-creator/tests"

# Release train entrypoints (TASK-35): the stdlib-only release tool now lives
# as scripts/release.py, resolved from __file__ so every pixi run task and
# workflow step invokes identical, locally-testable commands with no
# PYTHONPATH or locked dependency beyond the build environment.
[feature.python.tasks.test-release-tool]
cmd = "python -m pytest -c tests/scripts/pyproject.toml tests/scripts -q"

# The reference plugin (examples/reference_plugin) through its own
# `qgis-sdk test`: the pure target on the SDK fakes, then the `qgis` target
# against the headless QGIS this environment carries.
[feature.python.tasks.test-reference-example]
cmd = "python -m qgis_sdk_tools test --project examples/reference_plugin -q && python -m qgis_sdk_tools test --project examples/reference_plugin --target qgis -q"
env = { QT_QPA_PLATFORM = "offscreen" }

[feature.python.tasks.release-plan]
cmd = "python scripts/release.py plan"

[feature.python.tasks.release-classify]
cmd = "python scripts/release.py classify"

[feature.python.tasks.release-tag]
cmd = "python scripts/release.py tag"

[feature.python.tasks.release-stamp]
cmd = "python scripts/release.py stamp"

[feature.python.tasks.release-verify-versions]
cmd = "python scripts/release.py verify-versions"

[feature.python.tasks.release-build-python]
cmd = "python scripts/release.py build-python"

[feature.python.tasks.release-verify-python]
cmd = "python scripts/release.py verify-python"

[feature.python.tasks.package]
cmd = "pixi exec -c conda-forge --spec 'rattler-build>=0.77,<0.78' rattler-build build --recipe packages/qgis-sdk-python/recipe.yaml --output-dir dist/conda -c conda-forge"

[feature.python.tasks.release-build-conda]
cmd = "pixi exec -c conda-forge --spec 'rattler-build>=0.77,<0.78' rattler-build build --recipe packages/qgis-sdk-python/recipe.yaml --output-dir dist/conda -c conda-forge"

[feature.python.tasks.publish-conda]
args = [{ arg = "files", default = "dist/conda/*.conda" }]
cmd = "pixi upload prefix --channel 'archont561/archont561' --generate-attestation --skip-existing {{ files }}"

[feature.python.tasks.release-checksums]
cmd = "python scripts/release.py checksums"

[feature.python.tasks.release-github]
cmd = "python scripts/release.py github-release"

[feature.utils.dependencies]
ruff = "==0.17.1"
lefthook = "==2.2.2"
actionlint = "==1.7.12"
convco = "==0.7.2"

[feature.utils.tasks.ruff-lint]
cmd = "ruff check --fix"

[feature.utils.tasks.ruff-format]
cmd = "ruff format"

[feature.utils.tasks.convco-check-message]
args = ["message_file"]
cmd = "convco check --from-stdin --strip < '{{ message_file }}'"

[feature.utils.tasks.check-commits]
cmd = "convco check"

[feature.utils.tasks.lint-python]
# Whole-checkout scope: a new Python directory is linted without editing this task.
# Skipped trees are declared once in the root ruff.toml.
cmd = "ruff check ."

[feature.utils.tasks.format-python-check]
cmd = "ruff format --check ."

[feature.utils.tasks.lint-github-actions]
cmd = "actionlint .github/workflows/*.yml"

[feature.qgis.dependencies]
qgis = "==4.2.3"
pyqt6-webengine = "==6.11.0"

[feature.bun.dependencies]
bun = "==1.4.2"

[feature.bun.tasks.biome-fix]
cmd = "bun run biome check --write"

[feature.bun.tasks.install-js]
cmd = "bun install --frozen-lockfile"

[feature.bun.tasks.biome-check]
cmd = "bun run biome check ."

[feature.bun.tasks.typecheck]
cmd = "bun run --filter '@archont561/qgis-sdk' typecheck"

[feature.bun.tasks.turbo-test]
cmd = "bun run test"

[environments]
default = { features = ["python", "utils", "qgis"] }
build = { features = ["python"] }
bun = { features = ["bun"] }
