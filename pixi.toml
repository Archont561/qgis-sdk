[workspace]
name = "workspace"
channels = ["conda-forge"]
platforms = ["linux-64"]
preview = ["pixi-build"]

[feature.python.dependencies]
python = "==3.14.8"
pytest = "==9.1.1"
rich = "==15.0.0"
typer = "==0.27.3"
python-build = "==1.6.1"
twine = "==7.0.0"
hatchling = "==1.32.4"
# Runs the repository's task graph (`dodo.py`); see `[feature.python.tasks.automation]`.
doit = "==0.37.0"

# Wheels only: pixi-pack refuses path/sdist PyPI locations, so the workspace package
# stays on PYTHONPATH rather than an editable extra.
[feature.python.pypi-dependencies]
hypothesis = "==6.169.4"
pytest-cov = "==7.1.0"
pytest-bdd = "==9.0.0"
# Test-only contract export and schema oracle.
mashumaro = "==3.23"
jsonschema = "==4.26.0"
# Repository policy and workflow tests are also run in the build environment.
alint = "==0.20.1"
pyyaml = "==6.0.3"

[feature.python.activation.env]
# Absolute, so a task or a `qgis-sdk test` subprocess that runs in another
# working directory (the reference example) still imports the source tree.
PYTHONPATH = "$PIXI_PROJECT_ROOT/packages/qgis-sdk-runtime/src:$PIXI_PROJECT_ROOT/packages/qgis-sdk-tools/src"

# The one entry point for repository automation: `pixi run automation <task>`,
# where the tasks are declared in dodo.py and implemented in automation/. The
# Pixi tasks that remain below are single-command primitives - a compiler, a
# linter, `bun`, `pixi upload` - that a task calls, not automation of their own.
[feature.python.tasks.automation]
cmd = "doit"

[feature.python.tasks.package]
cmd = "pixi exec -c conda-forge --spec 'rattler-build>=0.77,<0.78' rattler-build build --recipe packages/qgis-sdk-python/recipe.yaml --output-dir dist/conda -c conda-forge"

[feature.python.tasks.release-build-conda]
cmd = "pixi exec -c conda-forge --spec 'rattler-build>=0.77,<0.78' rattler-build build --recipe packages/qgis-sdk-python/recipe.yaml --output-dir dist/conda -c conda-forge"

[feature.python.tasks.publish-conda]
args = [{ arg = "files", default = "dist/conda/*.conda" }]
cmd = "pixi upload prefix --channel 'archont561/archont561' --generate-attestation --skip-existing {{ files }}"

[feature.utils.dependencies]
ruff = "==0.17.1"
lefthook = "==2.2.2"
actionlint = "==1.7.12"
convco = "==0.7.2"

[feature.utils.tasks.ruff-lint]
cmd = "ruff check --fix"

[feature.utils.tasks.ruff-format]
cmd = "ruff format"

[feature.utils.tasks.convco-check-message]
args = ["message_file"]
cmd = "convco check --from-stdin --strip < '{{ message_file }}'"

[feature.qgis.dependencies]
qgis = "==4.2.3"
pyqt6-webengine = "==6.11.0"

[feature.bun.dependencies]
bun = "==1.4.2"

[feature.bun.tasks.biome-fix]
cmd = "bun run biome check --write"

[feature.bun.tasks.install-js]
cmd = "bun install --frozen-lockfile"

[feature.bun.tasks.biome-check]
cmd = "bun run biome check ."

[feature.bun.tasks.typecheck]
cmd = "bun run --filter '@archont561/qgis-sdk' build && bun run --filter '@archont561/qgis-sdk' typecheck && bun run --filter '@archont561/qgis-sdk-ui' typecheck"

[feature.bun.tasks.storybook-build]
# The static Storybook of qgis-sdk-ui; its own `build` runs first.
cmd = "bun run --filter '@archont561/qgis-sdk' build && bun run --filter '@archont561/qgis-sdk-ui' storybook:build"

# The documentation site (TASK-43): the Storybook of qgis-sdk-ui is built
# first so `apps/docs` can copy it under /storybook/, then the Next build
# renders the backlog guides and the hand-written pages into apps/docs/out.
# `bun run build` also runs `scripts/generate.ts` before it and
# `scripts/postbuild.ts` after it: the guides, sitemap, llms exports and the
# compatibility pages are all part of one command.
[feature.bun.tasks.docs-build]
cmd = "bun run --filter '@archont561/qgis-sdk' build && bun run --filter '@archont561/qgis-sdk-ui' storybook:build && bun run --filter '@workspace/docs' build"

# Every internal link and fragment of the built site resolves (TASK-43 AC 1).
[feature.bun.tasks.docs-link-check]
cmd = "bun run --filter '@workspace/docs' check-links"
depends-on = ["docs-build"]

# The site from source with reload, on 0.0.0.0:4321 (needs a Node runtime on
# PATH: Next builds and serves with it, the Pixi env only pins Bun).
# The documentation layer (docs/ and the root landing page), as CI runs it:
# Markdown structure here, then `.vale.ini` and `.lychee.toml` - two single
# binaries that are installed by the actions in
# `.github/workflows/docs-check.yml` rather than by this environment.
[feature.bun.tasks.lint-docs]
cmd = "bun run lint:markdown"

[feature.bun.tasks.docs-dev]
cmd = "bun run --filter '@workspace/docs' dev"

[feature.bun.tasks.turbo-test]
cmd = "bun run test"

# The reference page's Vitest suite on the workspace bridge: turbo builds
# `@archont561/qgis-sdk` first, then runs `simple-web`'s tests (decision-41).
[feature.bun.tasks.test-reference-web]
cmd = "bun run test --filter simple-web"

[environments]
default = { features = ["python", "utils", "qgis"] }
build = { features = ["python"] }
bun = { features = ["bun"] }
