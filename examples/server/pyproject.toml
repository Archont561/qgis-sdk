# Generated by `qgis-sdk new --host server`, then given the reference
# example's content (`examples/server` is the server variant of
# `examples/simple`). The project is the plugin: `qgis-sdk build` turns it into
# the ZIP QGIS Server unpacks, and `serverClassFactory` is already in the source
# because QGIS Server imports it from the package itself (decision-43).
[project]
name = "simple-server"
version = "0.1.0"
description = "The reference workflow's data answered by one QGIS Server plugin."
authors = [{ name = "qgis-sdk", email = "qgis-sdk@example.invalid" }]
requires-python = ">=3.11"
# The runtime the plugin is written for; `build` vendors the installed one and
# `check` reports a mismatch (VERSION004). `qgis-sdk` itself never installs.
dependencies = ["qgis-sdk-runtime>=0.8,<0.9"]

[dependency-groups]
dev = ["qgis-sdk-tools>=0.8,<0.9"]

[tool.qgis-sdk]
# The declaration `build`, `dev` and `describe` read. A server plugin declares
# hooks instead of actions, so this names the application and nothing uses it
# as a Desktop entry.
plugin = "simple_server.plugin:app"
# QGIS Server loads this package through serverClassFactory; a classFactory is
# never written, and `check` reports a Desktop-only declaration as HOST001.
# QGIS 3.44 is the LTS the server row runs (decision-70); QGIS 4 works too, and
# needs a QGIS built with WITH_SERVER=ON either way.
hosts = ["server"]
qgis-minimum-version = "3.44"
experimental = true
# Where QGIS is, when `qgis-sdk test` and `qgis-sdk dev` should not discover it
# (they otherwise try QGIS_PREFIX_PATH, `qgis` on PATH, then this environment).
# qgis-prefix = "/path/to/qgis"

[tool.qgis-sdk.metadata]
about = "One OGC service over the reference example's point fixture: a filter that fills in a missing VERSION, a service that answers REQUEST=extent, and an access-control hook that refuses the layers this deployment marks private."

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# The SDK's pytest plugin: the `qgis` and `desktop` markers, the `qgis_app` and
# `qgis_iface` fixtures, and the guard `qgis-sdk test` relies on. Plain `pytest`
# keeps working; `qgis-sdk test --target server` runs the bindings half.
addopts = "-p qgis_sdk_tools.pytest_plugin"
