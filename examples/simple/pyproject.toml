# Generated by `qgis-sdk new`. The project is the plugin: `qgis-sdk dev` runs
# this directory inside QGIS and `qgis-sdk build` turns it into the ZIP. QGIS's
# metadata.txt and classFactory are derived from this file (decision-43).
[project]
name = "simple"
version = "0.1.0"
description = "The local GIS workflow qgis-sdk is qualified against."
authors = [{ name = "qgis-sdk", email = "qgis-sdk@example.invalid" }]
requires-python = ">=3.11"
# The runtime the plugin is written for; `build` vendors the installed one and
# `check` reports a mismatch (VERSION004). `qgis-sdk` itself never installs.
dependencies = ["qgis-sdk-runtime>=0.9,<0.10"]

[dependency-groups]
dev = ["qgis-sdk-tools>=0.9,<0.10"]

[tool.qgis-sdk]
# The application QGIS runs; `build` and `dev` bind classFactory through
# qgis_sdk.adapters.desktop.host().
plugin = "simple.plugin:app"
# Both hosts the example is qualified on (decision-52): QGIS Desktop loads
# classFactory and places the page in web/ as a dock, and the same declaration
# runs as a standalone app (`python -m simple`, `qgis-sdk run`) - one class, two
# hosts. `qgis-sdk build --target app` turns it into an installable launcher.
hosts = ["desktop", "app"]
qgis-minimum-version = "4.0"
experimental = true
# Where QGIS is, when `qgis-sdk test` and `qgis-sdk dev` should not discover it
# (they otherwise try QGIS_PREFIX_PATH, `qgis` on PATH, then this environment).
# qgis-prefix = "/path/to/qgis"

[tool.qgis-sdk.metadata]
about = "Open a bundled dataset, read the selection, buffer into a styled layer, export explicitly - the same actions behind native dialogs and a web page."

[tool.qgis-sdk.web]
# The page in web/: shown as a dock; `grants` lists the host grants
# (`layers.read`) or operation ids (`project.layer_ids`) the page may use;
# `qgis-sdk bridge generate --host` renders the catalogue. The starter page's
# layer picker reads `layers.list`, which `layers.read` covers, and
# `algorithms.run` lets `runAlgorithm` from web/src/processing.schema.ts run
# the host's Processing algorithms (the centroids control).
placement = "dock"
grants = ["layers.read", "algorithms.run"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# The SDK's pytest plugin: the `qgis` and `desktop` markers, the `qgis_app` and
# `qgis_iface` fixtures, and the guard `qgis-sdk test` relies on. Plain `pytest`
# keeps working; `qgis-sdk test --target qgis|desktop` runs the native layers.
addopts = "-p qgis_sdk_tools.pytest_plugin"
